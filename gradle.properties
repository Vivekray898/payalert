# PayAlert — do NOT commit real credentials to VCS.
# Set these via environment or CI secrets before building.
# (Supabase is optional; the app is fully functional offline.)

# The daemon JDK major is pinned in gradle/gradle-daemon-jvm.properties.
# Use a full JDK (including jlink); keep machine-specific paths in local settings.
org.gradle.java.home=/Users/mamanjonpal/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=false

# AGP 9 has built-in Kotlin support; leaving it enabled is the recommended setup.
# KSP registers its generated sources through the kotlin.sourceSets DSL, which
# built-in Kotlin otherwise rejects. AGP documents this suppression flag for it.
android.disallowKotlinSourceSets=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
